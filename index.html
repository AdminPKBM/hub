        // --- SCRIPT UTAMA ---
        const container = document.getElementById('product-container');
        const searchInput = document.getElementById('searchInput');
        const notFoundMsg = document.getElementById('not-found');
        let products = [];

        // Fungsi Bersihkan Harga (Ubah 129,0RB jadi 129.000)
        const cleanPrice = (priceStr) => {
            if (!priceStr) return "0";
            let clean = priceStr.replace(/['"]+/g, ''); // Hapus tanda kutip

            // Jika format "129,0RB"
            if (clean.toUpperCase().includes("RB")) {
                clean = clean.replace(/RB/gi, '').replace(',', '.');
                let number = parseFloat(clean) * 1000;
                return new Intl.NumberFormat('id-ID').format(number);
            }
            
            // Jika format normal atau ada "Rp"
            return clean.replace('Rp', '').trim(); 
        };

        // Fungsi Render Produk
        function renderProducts(dataList) {
            container.innerHTML = '';
            
            if (dataList.length === 0) {
                container.classList.add('hidden');
                notFoundMsg.classList.remove('hidden');
                return;
            } else {
                container.classList.remove('hidden');
                notFoundMsg.classList.add('hidden');
            }

            dataList.forEach(item => {
                // Gunakan Link Ekstra jika ada, kalau tidak pakai Link Produk
                let finalLink = item['Link Komisi Ekstra'];
                if (!finalLink || finalLink.trim() === '') {
                    finalLink = item['Link Produk'];
                }

                // Generate Gambar Random (tapi konsisten per ID)
                const imgId = item['ID Produk'] || Math.random();
                const imgSrc = `https://picsum.photos/seed/${imgId}/300/300`;

                const cardHTML = `
                    <div class="bg-white rounded-xl overflow-hidden border border-slate-100 shadow hover:shadow-lg transition-all duration-300 flex flex-col h-full group">
                        <div class="relative overflow-hidden aspect-square">
                            <img src="${imgSrc}" alt="${item['Nama Produk']}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-3">
                                <p class="text-white text-[10px] font-bold uppercase tracking-wider">
                                    ${item['Penjualan']} Terjual
                                </p>
                            </div>
                        </div>
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="text-xs font-bold text-slate-800 mb-1 line-clamp-2 leading-relaxed h-8" title="${item['Nama Produk']}">
                                ${item['Nama Produk']}
                            </h3>
                            <div class="mt-auto pt-2">
                                <div class="text-indigo-600 font-extrabold text-base mb-3">
                                    Rp ${cleanPrice(item['Harga'])}
                                </div>
                                <a href="${finalLink}" target="_blank" class="block w-full text-center bg-slate-900 hover:bg-indigo-600 text-white py-2.5 rounded-lg text-xs font-bold transition-colors">
                                    BELI SEKARANG
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Parsing Data Saat Halaman Dibuka
        function init() {
            const results = Papa.parse(csvData, {
                header: true,
                skipEmptyLines: true
            });
            products = results.data;
            renderProducts(products);
        }

        // Fitur Pencarian
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = products.filter(item => 
                item['Nama Produk'].toLowerCase().includes(keyword)
            );
            renderProducts(filtered);
        });

        // Jalankan
        init();
    </script>
