<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB KANG RULI | Katalog Produk Pilihan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Loading Animation */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-extrabold tracking-tighter text-indigo-700">HUB.KANGRULI</div>
            <div class="hidden md:flex gap-8 text-sm font-bold text-slate-500 uppercase tracking-widest">
                <a href="#" class="hover:text-indigo-600">Katalog</a>
                <a href="#" class="hover:text-indigo-600">Best Seller</a>
            </div>
        </div>
    </nav>

    <header class="py-12 px-6">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4">Rekomendasi Produk Pilihan</h1>
            <p class="text-slate-500 max-w-2xl mx-auto italic">"Pilihan terbaik dengan harga termurah dan kualitas terjamin."</p>
        </div>
    </header>

    <main class="container mx-auto px-6 pb-24">
        <div id="loading" class="text-center py-10">
            <div class="loader"></div>
            <p class="text-slate-500 text-sm mt-4">Sedang mengambil data terbaru...</p>
        </div>

        <div id="product-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-10 text-center">
        <p class="text-slate-400 text-sm">© 2026 hub.kangruli.web.id | Partner Resmi Affiliate</p>
    </footer>

    <script>
        // Ganti ID Spreadsheet di sini jika berubah
        const SHEET_ID = "1xo-dKGA6Uxn78wUqGv-UbQLoHIWMb0SebTNC6bSEoUc";
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        const container = document.getElementById('product-container');
        const loading = document.getElementById('loading');

        // Fungsi parsing CSV yang lebih canggih untuk menangani tanda kutip "129,0RB"
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            // Hapus header (baris pertama)
            const dataLines = lines.slice(1);

            return dataLines.map(line => {
                // Regex untuk memisahkan koma, tapi mengabaikan koma di dalam tanda kutip
                const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                
                if (!matches) return null;

                // Membersihkan tanda kutip dari hasil regex
                const cols = matches.map(col => col.replace(/^"|"$/g, '').trim());

                // MAPPING DATA SESUAI FORMAT BARU ANDA:
                // Col 0: ID, Col 1: Nama, Col 2: Harga, Col 8: Link Komisi Ekstra
                return {
                    name: cols[1] || "Produk Tanpa Nama",
                    price: cols[2] || "Cek Harga",
                    link: cols[8] || cols[7] || "#", // Prioritas Link Komisi Ekstra, fallback ke Link Produk
                    sales: cols[3] || ""
                };
            }).filter(item => item && item.link !== "#"); 
        }

        async function loadProducts() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Gagal mengambil data");
                
                const csvText = await response.text();
                const products = parseCSV(csvText);

                if (products.length === 0) {
                    loading.innerHTML = "<p class='text-red-500'>Tidak ada data produk ditemukan.</p>";
                    return;
                }

                // Render HTML
                products.forEach((p, index) => {
                    // Placeholder Image (Karena di CSV tidak ada kolom gambar)
                    // Saya menggunakan keyword 'product' agar randomnya relevan
                    const imgSrc = `https://picsum.photos/seed/${index + 123}/400/400`;

                    container.innerHTML += `
                        <div class="product-card bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm flex flex-col h-full">
                            <div class="aspect-square bg-slate-100 relative overflow-hidden group">
                                <img src="${imgSrc}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                                
                                <div class="absolute top-2 right-2 bg-indigo-600/90 backdrop-blur text-white px-2 py-1 rounded-md text-[10px] font-bold shadow-sm">
                                    ${p.sales ? 'Terjual ' + p.sales : 'BEST SELLER'}
                                </div>
                            </div>
                            <div class="p-4 flex flex-col flex-grow justify-between">
                                <div>
                                    <h3 class="text-sm font-bold text-slate-800 mb-2 line-clamp-2 leading-snug" title="${p.name}">
                                        ${p.name}
                                    </h3>
                                    <div class="text-indigo-600 font-extrabold text-lg mb-4">
                                        Rp ${p.price}
                                    </div>
                                </div>
                                <a href="${p.link}" target="_blank" rel="nofollow" 
                                   class="block w-full text-center bg-slate-900 text-white py-3 rounded-xl text-xs font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200">
                                    BELI SEKARANG
                                </a>
                            </div>
                        </div>
                    `;
                });

                loading.style.display = 'none';
                container.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                loading.innerHTML = `
                    <div class="text-red-500 bg-red-50 p-4 rounded-xl inline-block">
                        <p class="font-bold">Gagal memuat data!</p>
                        <p class="text-xs mt-1">Pastikan Google Sheet sudah di-"Publish to Web" sebagai CSV.</p>
                    </div>
                `;
            }
        }

        loadProducts();
    </script>
</body>
</html>
