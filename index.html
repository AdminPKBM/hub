<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB KANG RULI | Katalog Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .loader { border: 4px solid #cbd5e1; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="bg-white sticky top-0 z-50 shadow-sm border-b border-slate-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-xl font-extrabold text-indigo-700 tracking-tight">HUB.KANGRULI</div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 pb-24">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2">Rekomendasi Terbaik</h1>
            <p class="text-slate-500 text-sm">Update Realtime dari Database</p>
        </div>

        <div id="loading" class="text-center py-10">
            <div class="loader"></div>
            <p class="text-slate-500 text-sm mt-4">Sedang mengambil data terbaru...</p>
        </div>

        <div id="error-msg" class="hidden text-center py-10">
            <div class="bg-red-50 text-red-600 p-6 rounded-xl inline-block border border-red-200 max-w-lg">
                <p class="font-bold text-lg mb-2">Gagal Memuat Data!</p>
                <p class="text-sm">Pastikan Anda menggunakan <b>Link Publikasi CSV</b>, bukan link edit.</p>
                <p class="text-xs mt-4 text-red-400">File -> Bagikan -> Publikasikan ke Web -> Pilih CSV -> Salin Link</p>
            </div>
        </div>

        <div id="product-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 hidden">
            </div>
    </main>

    <script>
        // --- BAGIAN PENTING: GANTI LINK DI BAWAH INI ---
        // Pastikan akhiran link adalah: /pub?output=csv
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7mfrdLCUYC1dsGJ5F_ixbZiZ7eA28nCn-MMvPGkAfcmGi20pW2ltTP4O2lkDAR0KoJjxczeT3UEAz/pub?output=csv"; 
        
        const container = document.getElementById('product-container');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');

        // Fungsi membersihkan format harga Shopee (misal: "129,0RB" -> "129.000")
        const cleanPrice = (priceStr) => {
            if (!priceStr) return "0";
            // Hapus tanda kutip jika ada
            let clean = priceStr.replace(/['"]+/g, '');
            
            // Cek jika ada "RB" (Ribu)
            if (clean.toUpperCase().includes("RB")) {
                clean = clean.replace(/RB/gi, '').replace(',', '.');
                let number = parseFloat(clean) * 1000;
                return new Intl.NumberFormat('id-ID').format(number);
            }
            
            // Jika angka biasa
            return clean;
        };

        function loadProducts() {
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    console.log("Data loaded:", data); // Cek console browser untuk debug

                    if (!data || data.length === 0) {
                        showError(); 
                        return;
                    }

                    // Cek apakah header benar (Minimal ada Nama Produk)
                    const firstRow = data[0];
                    if (!firstRow.hasOwnProperty('Nama Produk')) {
                        console.error("Kolom 'Nama Produk' tidak ditemukan!");
                        showError();
                        return;
                    }

                    let hasProduct = false;

                    data.forEach((row, index) => {
                        const nama = row['Nama Produk'];
                        const hargaRaw = row['Harga'];
                        const penjualan = row['Penjualan'];
                        
                        // Logika Link: Utamakan Link Komisi Ekstra
                        let link = row['Link Komisi Ekstra'];
                        if (!link || link.trim() === "") {
                            link = row['Link Produk'];
                        }

                        // Skip jika data kosong
                        if (!nama || !link) return;

                        hasProduct = true;
                        
                        // Format Harga
                        const hargaFinal = cleanPrice(hargaRaw);

                        // Gambar Random (Karena di CSV belum ada kolom URL Gambar)
                        // Menggunakan ID unik agar gambar konsisten per produk
                        const uniqueId = row['ID Produk'] || index;
                        const imgSrc = `https://picsum.photos/seed/${uniqueId}/300/300`;

                        container.innerHTML += `
                            <div class="bg-white rounded-xl overflow-hidden border border-slate-100 shadow hover:shadow-lg transition-all duration-300 flex flex-col h-full group">
                                <div class="relative overflow-hidden aspect-square">
                                    <img src="${imgSrc}" alt="${nama}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-3">
                                        <p class="text-white text-xs font-medium">
                                            ${penjualan ? penjualan + ' Terjual' : 'Terlaris'}
                                        </p>
                                    </div>
                                </div>
                                <div class="p-3 flex flex-col flex-grow">
                                    <h3 class="text-xs font-bold text-slate-800 mb-1 line-clamp-2 leading-relaxed h-8" title="${nama}">
                                        ${nama}
                                    </h3>
                                    <div class="mt-auto pt-2">
                                        <div class="text-indigo-600 font-extrabold text-base mb-3">
                                            Rp ${hargaFinal}
                                        </div>
                                        <a href="${link}" target="_blank" class="block w-full text-center bg-slate-900 hover:bg-indigo-600 text-white py-2.5 rounded-lg text-xs font-bold transition-colors">
                                            BELI SEKARANG
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    if (hasProduct) {
                        loading.style.display = 'none';
                        container.classList.remove('hidden');
                    } else {
                        showError();
                    }
                },
                error: function(err) {
                    console.error("Error parsing CSV:", err);
                    showError();
                }
            });
        }

        function showError() {
            loading.style.display = 'none';
            errorMsg.classList.remove('hidden');
        }

        loadProducts();
    </script>
</body>
</html>
