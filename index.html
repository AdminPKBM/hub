<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Kang Ruli | Pilihan Produk Terbaik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .product-card:hover .btn-buy { background-color: #4f46e5; color: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tighter text-indigo-600">HUB.KANGRULI</h1>
            <div class="space-x-6 text-sm font-bold text-slate-600">
                <a href="#" class="hover:text-indigo-600">REKOMENDASI</a>
                <a href="#" class="hover:text-indigo-600">KATEGORI</a>
            </div>
        </div>
    </nav>

    <header class="py-16 px-6 bg-gradient-to-b from-white to-slate-50">
        <div class="container mx-auto text-center">
            <h2 class="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight">Cari Produk? <br><span class="text-indigo-600">Tanya Kang Ruli.</span></h2>
            <p class="text-slate-500 max-w-2xl mx-auto">Referensi produk terbaik yang dirangkum dari kurasi ahli, membantu Anda belanja lebih cerdas dan hemat.</p>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div id="app" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <p class="text-center col-span-full text-slate-400">Memuat kurasi produk terbaik...</p>
        </div>
    </main>

    <script>
        const MY_AFF_ID = "11368310025";

        // Simulasi Data yang diambil dari My-Best (Karena scraping langsung tidak bisa di client-side)
        // Anda bisa mengupdate list ini secara manual atau menggunakan otomasi
        const scrapedProducts = [
            {
                title: "Mouse Wireless Ergonomis",
                price: "Rp 125.000",
                img: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400",
                shopeeLink: "https://shopee.co.id/product-example-1"
            },
            {
                title: "Keyboard Mechanical RGB",
                price: "Rp 450.000",
                img: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=400",
                shopeeLink: "https://shopee.co.id/product-example-2"
            }
            // Tambahkan data lainnya di sini
        ];

        function renderProducts() {
            const container = document.getElementById('app');
            container.innerHTML = '';

            scrapedProducts.forEach(p => {
                // LOGIKA OTOMATIS: Ganti link Shopee biasa ke Link Affiliate
                const cleanLink = p.shopeeLink.split('?')[0]; // Hapus parameter lama
                const finalLink = `${cleanLink}?smtt=0.0.${MY_AFF_ID}`;

                container.innerHTML += `
                    <div class="product-card bg-white rounded-3xl p-4 shadow-sm border border-slate-100 transition-all duration-300 hover:shadow-xl">
                        <div class="aspect-square rounded-2xl overflow-hidden mb-4 bg-slate-100">
                            <img src="${p.img}" class="w-full h-full object-cover">
                        </div>
                        <h3 class="font-bold text-slate-800 mb-1 truncate">${p.title}</h3>
                        <p class="text-indigo-600 font-extrabold mb-4">${p.price}</p>
                        <a href="${finalLink}" target="_blank" class="btn-buy block w-full text-center py-3 rounded-2xl bg-slate-50 text-slate-900 font-bold text-sm transition-all border border-slate-200">
                            Cek Detail Produk
                        </a>
                    </div>
                `;
            });
        }

        renderProducts();
    </script>
</body>
</html>
