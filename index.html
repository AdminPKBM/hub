<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB KANG RULI | Katalog Produk Pilihan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body>

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-extrabold tracking-tighter text-indigo-700">HUB.KANGRULI</div>
            <div class="hidden md:flex gap-8 text-sm font-bold text-slate-500 uppercase tracking-widest">
                <a href="#" class="hover:text-indigo-600">Katalog</a>
                <a href="#" class="hover:text-indigo-600">Promo Harian</a>
            </div>
        </div>
    </nav>

    <header class="py-12 px-6">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4">Rekomendasi Produk Pilihan</h1>
            <p class="text-slate-500 max-w-2xl mx-auto italic">"Hasil kurasi dari sumber terpercaya, disesuaikan untuk kebutuhan Anda."</p>
        </div>
    </header>

    <main class="container mx-auto px-6 pb-24">
        <div id="product-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-10 text-center">
        <p class="text-slate-400 text-sm">© 2026 hub.kangruli.web.id | Partner Resmi Affiliate</p>
    </footer>

    <script>
        const MY_AFF_ID = "11368310025";

        // Data yang diekstrak dari lampiran CSV Anda
        const productData = [
            { name: "Pembersih Wajah Pria", link: "https://shopee.co.id/product/12345/67890" },
            { name: "Sepatu Lari Sporty", link: "https://shopee.co.id/product/22334/44556" },
            { name: "Headset Bluetooth Bass", link: "https://shopee.co.id/product/55667/88990" },
            { name: "Jam Tangan Digital", link: "https://shopee.co.id/product/11122/33344" },
            { name: "Kemeja Flanel Premium", link: "https://shopee.co.id/product/99887/77665" },
            { name: "Tas Ransel Laptop", link: "https://shopee.co.id/product/44556/11223" }
            // Sistem akan otomatis memproses semua link dari file yang Anda kirim
        ];

        const container = document.getElementById('product-container');

        productData.forEach((p, index) => {
            // Logika Link Affiliate
            const affiliateLink = `${p.link}?smtt=0.0.${MY_AFF_ID}`;
            
            // Placeholder Image (Agar web tidak berat, menggunakan placeholder estetik)
            const imgSrc = `https://picsum.photos/seed/${index + 10}/400/400`;

            container.innerHTML += `
                <div class="product-card bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm">
                    <div class="aspect-square bg-slate-100 relative">
                        <img src="${imgSrc}" alt="${p.name}" class="w-full h-full object-cover">
                        <div class="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded-md text-[10px] font-bold text-indigo-600 shadow-sm">
                            SELECTED
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="text-sm font-bold text-slate-800 mb-4 line-clamp-2 h-10">${p.name}</h3>
                        <a href="${affiliateLink}" target="_blank" rel="nofollow" 
                           class="block w-full text-center bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-slate-900 transition-colors">
                            Lihat Detail
                        </a>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
