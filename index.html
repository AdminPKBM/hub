<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB KANG RULI | Official Product Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .card-hover:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <nav class="glass border-b border-gray-100 sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-xl font-extrabold tracking-tighter text-indigo-700">HUB.KANG RULI</span>
            </div>
            <div class="hidden md:flex gap-6 text-sm font-semibold text-gray-500">
                <a href="#" class="hover:text-indigo-600">Terbaru</a>
                <a href="#" class="hover:text-indigo-600">Kategori</a>
                <a href="#" class="hover:text-indigo-600">Cek Pesanan</a>
            </div>
        </div>
    </nav>

    <header class="py-16 px-6">
        <div class="container mx-auto text-center">
            <h1 class="text-5xl font-extrabold text-gray-900 leading-tight mb-4">
                Pusat Rekomendasi <br><span class="text-indigo-600">Produk Pilihan Terbaik</span>
            </h1>
            <p class="text-gray-500 max-w-xl mx-auto mb-8">
                Kami mengurasi produk-produk berkualitas dengan harga paling kompetitif untuk kebutuhan harian Anda.
            </p>
            <div class="flex justify-center gap-3">
                <div class="bg-gray-100 px-4 py-2 rounded-full text-xs font-bold text-gray-600">100% TERVERIFIKASI</div>
                <div class="bg-gray-100 px-4 py-2 rounded-full text-xs font-bold text-gray-600">UPDATE SETIAP HARI</div>
            </div>
        </div>
    </header>

    <section class="container mx-auto px-6 mb-8">
        <div class="flex flex-wrap gap-2 justify-center">
            <button class="bg-indigo-600 text-white px-6 py-2 rounded-full text-sm font-bold">Semua</button>
            <button class="bg-white border border-gray-200 text-gray-600 px-6 py-2 rounded-full text-sm font-bold hover:bg-gray-50">Elektronik</button>
            <button class="bg-white border border-gray-200 text-gray-600 px-6 py-2 rounded-full text-sm font-bold hover:bg-gray-50">Fashion</button>
            <button class="bg-white border border-gray-200 text-gray-600 px-6 py-2 rounded-full text-sm font-bold hover:bg-gray-50">Hobi</button>
        </div>
    </section>

    <main class="container mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8" id="product-list">
            </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-12">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm font-bold text-gray-900 mb-2">HUB.KANG RULI</p>
            <p class="text-xs text-gray-400">© 2026 Direct Product Hub. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // DATA SETTINGS
        const AFF_ID = "11368310025";

        // DATABASE PRODUK
        // Ganti 'link' dengan URL produk Shopee yang ingin Anda tawarkan
        const products = [
            {
                name: "Mechanical Keyboard RGB G50",
                price: "Rp 345.000",
                img: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=500&q=80",
                link: "https://shopee.co.id/product-link-1"
            },
            {
                name: "Ergonomic Office Chair Premium",
                price: "Rp 1.250.000",
                img: "https://images.unsplash.com/photo-1505797149-43b007662c21?w=500&q=80",
                link: "https://shopee.co.id/product-link-2"
            },
            {
                name: "Ultra Wide Monitor 34 Inch",
                price: "Rp 4.200.000",
                img: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=500&q=80",
                link: "https://shopee.co.id/product-link-3"
            },
            {
                name: "Smart LED Desk Lamp",
                price: "Rp 199.000",
                img: "https://images.unsplash.com/photo-1534073828943-f801091bb18c?w=500&q=80",
                link: "https://shopee.co.id/product-link-4"
            }
        ];

        const list = document.getElementById('product-list');

        products.forEach(p => {
            // URL Builder untuk Affiliate
            const affiliateURL = `${p.link}?smtt=0.0.${AFF_ID}`;
            
            list.innerHTML += `
                <div class="card-hover transition-all duration-300">
                    <div class="bg-gray-200 rounded-2xl overflow-hidden aspect-[4/5] mb-4">
                        <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-bold text-gray-900 text-lg mb-1 truncate">${p.name}</h3>
                    <p class="text-indigo-600 font-bold mb-4">${p.price}</p>
                    <a href="${affiliateURL}" target="_blank" rel="nofollow" 
                       class="inline-block w-full text-center bg-gray-900 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-600 transition-colors">
                        Check Availability
                    </a>
                </div>
            `;
        });
    </script>
</body>
</html>
